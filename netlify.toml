[build]
  command = "npm run build"
  publish = "out"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "20"

# Next.js static export already emits one prerendered HTML file per route
# (out/dashboard/index.html, etc.), so no SPA catch-all redirect is needed.
# 404.html at the publish root is picked up by Netlify automatically.

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
